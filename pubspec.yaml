name: voxspend
description: "AI 智能记账助手 - 语音/自然语言离线记账应用"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 状态管理
  flutter_riverpod: ^2.5.1
  # 本地数据库
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  # 加密 KV 存储（API Key）
  flutter_secure_storage: ^9.2.2
  # 图表
  fl_chart: ^0.69.0
  # 网络
  http: ^1.2.2
  # 工具
  intl: ^0.19.0
  path_provider: ^2.1.4
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Isar 代码生成
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
